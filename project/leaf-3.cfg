leaf-3#sh run
! Command: show running-config
! device: leaf-3 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
no logging console
!
hostname leaf-3
!
spanning-tree mode mstp
!
vlan 100,200
   name TENANT_A_CLIENTS
!
vlan 101
   name TENANT_B_CLIENTS
!
vrf instance TENANT_A
   rd 10.0.3.11:50001
!
vrf instance TENANT_B
   rd 10.0.3.11:50002
!
interface Ethernet1
   description to-spine-1
   mtu 9214
   no switchport
   ip address 10.1.3.1/31
!
interface Ethernet2
   description to-spine-2
   mtu 9214
   no switchport
   ip address 10.2.3.1/31
!
interface Ethernet3
   description to-client-3
   switchport access vlan 100
!
interface Ethernet4
!
interface Ethernet5
   description to-border-router-1_TENANT_A
   mtu 9214
   no switchport
   vrf TENANT_A
   ip address 10.254.254.1/31
!
interface Ethernet6
   description to-border-router-1_TENANT_B
   mtu 9214
   no switchport
   vrf TENANT_B
   ip address 10.254.254.3/31
!
interface Ethernet7
   description to-border-router-2_TENANT_A
   mtu 9214
   no switchport
   vrf TENANT_A
   ip address 10.254.254.5/31
!
interface Ethernet8
   description to-border-router-2_TENANT_B
   mtu 9214
   no switchport
   vrf TENANT_B
   ip address 10.254.254.7/31
!
interface Loopback0
   ip address 10.0.3.1/32
!
interface Loopback1
   description VTEP_Source
   ip address 10.0.3.11/32
!
interface Management1
   ip address 10.255.0.13/24
!
interface Vlan100
   description Anycast Gateway for VLAN 100
   vrf TENANT_A
   ip address virtual 192.168.100.1/24
!
interface Vlan101
   description Anycast Gateway for VLAN 101
   vrf TENANT_B
   ip address virtual 192.168.101.1/24
!
interface Vlan200
   description Anycast Gateway for VLAN 200
   vrf TENANT_A
   ip address virtual 192.168.200.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vlan 200 vni 10200
   vxlan vrf TENANT_A vni 50001
   vxlan vrf TENANT_B vni 50002
   vxlan flood vtep 10.0.1.11 10.0.2.11 10.0.3.11
!
ip virtual-router mac-address 00:00:00:00:99:99
!
ip routing
ip routing vrf TENANT_A
ip routing vrf TENANT_B
!
router bgp 65503
   router-id 10.0.3.1
   no bgp default ipv4-unicast
   timers bgp 1 3
   distance bgp 20 200 200
   maximum-paths 2 ecmp 2
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65500
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY ebgp-multihop 3
   neighbor OVERLAY send-community extended
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65500
   neighbor UNDERLAY bfd
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.1.3.0 peer group UNDERLAY
   neighbor 10.2.3.0 peer group UNDERLAY
   !
   vlan 100
      rd 10.0.3.11:10100
      route-target import 65000:10100
      route-target export 65000:10100
      redistribute learned
   !
   vlan 101
      rd 10.0.3.11:10101
      route-target import 65000:10101
      route-target export 65000:10101
      redistribute learned
   !
   vlan 200
      rd 10.0.3.11:10200
      route-target import 65000:10200
      route-target export 65000:10200
      redistribute learned
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.0.3.1/32
      network 10.0.3.11/32
   !
   vrf TENANT_A
      rd 10.0.3.11:50001
      route-target import evpn 65000:50001
      route-target export evpn 65000:50001
      neighbor 10.254.254.0 remote-as 65510
      neighbor 10.254.254.0 description Border-Router-1_TENANT_A
      neighbor 10.254.254.0 allowas-in 1
      neighbor 10.254.254.4 remote-as 65510
      neighbor 10.254.254.4 description Border-Router-2_TENANT_A
      neighbor 10.254.254.4 allowas-in 1
      !
      address-family ipv4
         neighbor 10.254.254.0 activate
         neighbor 10.254.254.4 activate
         redistribute connected
   !
   vrf TENANT_B
      rd 10.0.3.11:50002
      route-target import evpn 65000:50002
      route-target export evpn 65000:50002
      neighbor 10.254.254.2 remote-as 65510
      neighbor 10.254.254.2 description Border-Router-TENANT_B
      neighbor 10.254.254.2 allowas-in 1
      neighbor 10.254.254.6 remote-as 65510
      neighbor 10.254.254.6 description Border-Router-2_TENANT_B
      neighbor 10.254.254.6 allowas-in 1
      !
      address-family ipv4
         neighbor 10.254.254.2 activate
         neighbor 10.254.254.6 activate
         redistribute connected
!
end
leaf-3#
